{# Inline SVG icons: one family, 1.75 stroke, currentColor, no emoji. #}
{% macro icon(name, size=18) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'logo' -%}
    <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l2.5 2.5L16 9.5"/>
  {%- elif name == 'check' -%}
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>
  {%- elif name == 'alert' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.5h.01"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14"/><path d="M5 12h14"/>
  {%- elif name == 'back' -%}
    <path d="M15 6l-6 6 6 6"/>
  {%- elif name == 'upload' -%}
    <path d="M12 16V5"/><path d="M8 9l4-4 4 4"/><path d="M4 16v3h16v-3"/>
  {%- elif name == 'send' -%}
    <path d="M4 12l16-7-7 16-2.5-6.5L4 12z"/>
  {%- elif name == 'exit' -%}
    <path d="M14 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/>
  {%- endif -%}
</svg>
{% endmacro %}
