{% extends "base.html" %}
{% block title %}Brand form{% endblock %}
{% block content %}
<h1>{{ "Edit brand" if brand.id else "New brand" }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Brand name
    <input name="name" value="{{ name }}" required maxlength="120">
  </label>
  {% if brand.id %}
    <p>Client {{ brand.client.name }}</p>
  {% else %}
    <label>Client
      <select name="client_id" required>
        <option value="">Choose a client</option>
        {% for client in clients %}
          <option value="{{ client.id }}"
            {% if client.id == client_id %}selected{% endif %}>
            {{ client.name }}
          </option>
        {% endfor %}
      </select>
    </label>
  {% endif %}
  <button type="submit">Save brand</button>
  <a href="{{ url_for('campaigns.brand_list') }}">Cancel</a>
</form>
{% endblock %}
